# Чек-лист п. 10: быстро получать патчи безопасности.
# Dependabot раз в неделю открывает PR с обновлениями; срочные security-фиксы — сразу.
version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/avatar-front"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "npm"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "monthly" }
  - package-ecosystem: "gradle"
    directory: "/avatar-front/android"
    schedule: { interval: "monthly" }
